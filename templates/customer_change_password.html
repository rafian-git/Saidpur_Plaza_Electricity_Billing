{% extends 'customer_layout.html' %}

{% block title %}পাসওয়ার্ড পরিবর্তন - সৈয়দপুর প্লাজা{% endblock %}

{% block content %}
<style>
    .password-card { background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); max-width: 480px; width: 100%; margin: 40px auto; padding: 40px; }
    .btn-update-password { background: linear-gradient(to right, #11998e, #38ef7d); border: none; color: white; font-weight: 700; padding: 12px; font-size: 18px; transition: all 0.3s ease; }
    .btn-update-password:hover { opacity: 0.9; transform: translateY(-2px); color: white; }
</style>

<div class="password-card">
    <div class="text-center mb-4">
        <span style="font-size: 40px;">🔒</span>
        <h4 class="fw-bold text-dark mt-2">পাসওয়ার্ড পরিবর্তন করুন</h4>
        <p class="text-muted small fw-semibold">আপনার একাউন্টের নিরাপত্তা নিশ্চিত করুন</p>
    </div>

    <form action="{{ url_for('customer_change_password') }}" method="POST" id="passwordForm">
        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">বর্তমান পাসওয়ার্ড</label>
            <input type="password" class="form-control form-control-lg" name="current_password" required>
        </div>
        
        <hr class="my-4 text-muted">

        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">নতুন পাসওয়ার্ড</label>
            <input type="password" class="form-control form-control-lg" id="new_password" name="new_password" required minlength="6">
            <div class="form-text small">কমপক্ষে ৬ অক্ষরের হতে হবে।</div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold text-secondary">নতুন পাসওয়ার্ড নিশ্চিত করুন</label>
            <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" required>
            <div id="passwordError" class="text-danger fw-bold mt-1" style="display:none; font-size: 0.85rem;">⚠️ পাসওয়ার্ড দুটি মিলছে না!</div>
        </div>
        
        <button type="submit" class="btn btn-update-password w-100 btn-lg rounded-3">পাসওয়ার্ড আপডেট করুন 🔄</button>
    </form>
</div>

<script>
    const newPass = document.getElementById('new_password');
    const confPass = document.getElementById('confirm_password');
    const errorMsg = document.getElementById('passwordError');

    // রিয়েল-টাইম ভ্যালিডেশন
    function checkPasswords() {
        if (confPass.value.length > 0 && newPass.value !== confPass.value) {
            errorMsg.style.display = 'block';
            confPass.classList.add('is-invalid');
        } else {
            errorMsg.style.display = 'none';
            confPass.classList.remove('is-invalid');
        }
    }

    confPass.addEventListener('input', checkPasswords);
    newPass.addEventListener('input', checkPasswords);
</script>
{% endblock %}
