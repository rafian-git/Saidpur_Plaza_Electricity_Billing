{% extends 'customer_layout.html' %}

{% block title %}পাসওয়ার্ড রিকভারি - সৈয়দপুর প্লাজা{% endblock %}

{% block content %}
<style>
    .recovery-card { background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); max-width: 450px; width: 100%; margin: 50px auto; padding: 40px; }
    .btn-recovery { background: linear-gradient(to right, #ff416c, #ff4b2b); border: none; color: white; font-weight: 700; padding: 12px; font-size: 18px; transition: all 0.3s ease; }
    .btn-recovery:hover { opacity: 0.9; transform: translateY(-2px); color: white; }
</style>

<div class="recovery-card">
    <div class="text-center mb-4">
        <span style="font-size: 40px;">🔑</span>
        <h4 class="fw-bold text-dark mt-2">পাসওয়ার্ড পুনরুদ্ধার করুন</h4>
        <p class="text-muted small">আপনার গ্রাহক আইডি ও রেজিস্টার্ড মোবাইল নম্বর দিন</p>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">গ্রাহক আইডি (Customer ID)</label>
            <input type="text" class="form-control form-control-lg" name="customer_id" placeholder="যেমন: 101 বা C-01" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">রেজিস্টার্ড মোবাইল নম্বর</label>
            <input type="text" class="form-control form-control-lg" name="phone" placeholder="01XXXXXXXXX" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold text-secondary">নতুন পাসওয়ার্ড</label>
            <input type="password" class="form-control form-control-lg" name="new_password" placeholder="কমপক্ষে ৬ অক্ষরের" required minlength="6">
        </div>

        <button type="submit" class="btn btn-recovery w-100 btn-lg rounded-3">পাসওয়ার্ড রিসেট করুন 🔄</button>
    </form>

    <div class="text-center mt-3">
        <a href="{{ url_for('customer_login') }}" class="text-decoration-none small fw-bold text-primary">⬅️ লগইন পেজে ফিরে যান</a>
    </div>
</div>
{% endblock %}
