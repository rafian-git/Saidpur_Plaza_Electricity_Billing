<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গ্রাহক পোর্টাল | সৈয়দপুর প্লাজা</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .customer-login-container { background: #ffffff; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); max-width: 450px; width: 100%; padding: 40px; }
        .portal-title { color: #11998e; font-weight: 700; font-size: 28px; }
        .btn-customer-login { background: linear-gradient(to right, #11998e, #38ef7d); border: none; color: white; font-weight: 700; padding: 14px; transition: 0.3s; }
        .btn-customer-login:hover { box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4); transform: translateY(-2px); color: white; }
    </style>
</head>
<body>

<div class="customer-login-container">
    <div class="text-center mb-4">
        <h1 class="portal-title">গ্রাহক পোর্টাল 📱</h1>
        <p class="text-muted fw-semibold">সৈয়দপুর প্লাজা বিদ্যুৎ বিলিং সেবা</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show text-center">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('customer_login') }}" method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">গ্রাহক আইডি</label>
            <input type="text" class="form-control form-control-lg" name="customer_id" placeholder="আপনার আইডি দিন" required autofocus autocomplete="username">
        </div>
        
        <div class="mb-4">
            <label class="form-label fw-bold text-secondary">পাসওয়ার্ড</label>
            <div class="input-group">
                <input type="password" class="form-control form-control-lg" name="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                <button class="btn btn-outline-secondary" type="button" onclick="togglePass()" id="toggleBtn"><i class="bi bi-eye"></i></button>
            </div>
        </div>
        
        <button type="submit" class="btn btn-customer-login w-100 btn-lg rounded-3">পোর্টালে প্রবেশ করুন ➔</button>
    </form>

    <!-- <div class="text-center mt-4">
        <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold" style="color: #11998e;">← স্টাফ লগইন পাতায় ফিরুন</a>
    </div> -->
</div>

<script>
    function togglePass() {
        const passInput = document.getElementById("password");
        const toggleBtn = document.getElementById("toggleBtn");
        if (passInput.type === "password") {
            passInput.type = "text";
            toggleBtn.innerHTML = '<i class="bi bi-eye-slash"></i>';
        } else {
            passInput.type = "password";
            toggleBtn.innerHTML = '<i class="bi bi-eye"></i>';
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
